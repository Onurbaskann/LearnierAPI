# Compose proje adi acikca sabitlenir.
# Aksi halde klasor adindan turetilir ve klasor yeniden adlandirildiginda
# mevcut container ile volume'lar oksuz kalir.
name: learnier

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learnier}
      POSTGRES_USER: ${POSTGRES_USER:-learnier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanimli degil - .env dosyasini olusturun}
    ports:
      # Yerel gelistirmede dotnet ef ve testlerin baglanabilmesi icin disari acilir.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 imaji veriyi /var/lib/postgresql/<surum>/docker altina koyar.
      # Volume'u /var/lib/postgresql/data'ya baglamak container'in acilmamasina yol
      # aciyordu; mount tek seviye yukari alindi.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # API'nin hazir olmayan veritabanina baglanmaya calismasini engeller.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learnier} -d ${POSTGRES_DB:-learnier}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      # Baglam depo koku: Directory.Packages.props ve tum katman projeleri gerekli.
      context: .
      dockerfile: src/Learnier.WebApi/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: 8080
      # Cift alt cizgi ic ice yapilandirma bolumlerini ayirir.
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-learnier};Username=${POSTGRES_USER:-learnier};Password=${POSTGRES_PASSWORD}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY tanimli degil - .env dosyasini olusturun}
    ports:
      - "${API_PORT:-5080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
